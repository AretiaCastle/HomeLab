# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    image: pihole/pihole:2026.10.1
    hostname: pihole
    container_name: pihole
    restart: unless-stopped
    ports:
      # DNS Ports
      - "$PIHOLE_DNS_PORT:53/tcp"
      - "$PIHOLE_DNS_PORT:53/udp"
      # Web interface. Ports 80 and 443 are left to the ingress service
      - "$PIHOLE_WEB_INTERFACE_PORT:80/tcp"
    volumes:
      - pihole_etc:/etc/pihole
    env_file:
      - ./.env.pihole

volumes:
  pihole_etc:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "$PIHOLE_ETC_PATH"
